.theme-toggle{
  position:relative;flex:none;z-index:2;
  width:63px;height:30px;padding:0;
  appearance:none;-webkit-appearance:none;
  border:1px solid rgba(95,143,119,.16);border-radius:999px;
  cursor:pointer;overflow:hidden;isolation:isolate;
  background:linear-gradient(100deg,rgba(49,194,126,.22) 0%,rgba(49,194,126,.105) 48%,rgba(49,194,126,.012) 100%),rgba(232,243,237,.12);
  backdrop-filter:blur(19px) saturate(180%) contrast(106%);
  -webkit-backdrop-filter:blur(19px) saturate(180%) contrast(106%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.09),inset 0 -5px 10px rgba(15,60,45,.035),0 3px 10px rgba(0,0,0,.10);
  transition:background .48s ease,border-color .48s ease,box-shadow .48s ease,transform .2s ease;
}
/* Broad, diffused refraction only—no sharp white stripe. */
.theme-toggle::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(90% 150% at 15% -20%,rgba(255,255,255,.14),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 65%);
  opacity:.62;transition:opacity .48s ease,background .48s ease;
}
/* Light mode: faint emerald tint at the left, smoothly clearing to the right. */
.theme-toggle[data-mode="light"]{
  background:linear-gradient(100deg,rgba(49,194,126,.22) 0%,rgba(49,194,126,.105) 48%,rgba(49,194,126,.012) 100%),rgba(232,243,237,.12);
  border-color:rgba(82,160,121,.16);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.09),inset 0 -5px 10px rgba(15,60,45,.035),0 3px 10px rgba(0,0,0,.10);
}
/* Dark mode: only a very faint white gradient, brightest at the right and fading left. */
.theme-toggle[data-mode="dark"]{
  background:linear-gradient(270deg,rgba(255,255,255,.105) 0%,rgba(255,255,255,.052) 46%,rgba(255,255,255,.012) 100%),rgba(255,255,255,.012);
  border-color:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.045),inset 0 -5px 10px rgba(0,0,0,.09),0 3px 10px rgba(0,0,0,.17);
}
.theme-toggle[data-mode="dark"]::before{
  background:radial-gradient(90% 145% at 82% -22%,rgba(255,255,255,.075),transparent 63%);
  opacity:.58;
}
.theme-knob{
  position:absolute;z-index:2;top:1.5px;left:1.5px;width:25.5px;height:25.5px;
  border-radius:50%;display:grid;place-items:center;overflow:hidden;
  border:1px solid rgba(185,221,247,.42);
  transform:translateX(0);
  backdrop-filter:blur(12px) saturate(175%);
  -webkit-backdrop-filter:blur(12px) saturate(175%);
  transition:transform .56s cubic-bezier(.22,1,.36,1),background .48s ease,box-shadow .48s ease,border-color .48s ease;
  will-change:transform;
}
/* Curved, diffuse reflections make the knob read as liquid glass without a line highlight. */
.theme-knob::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:radial-gradient(74% 52% at 28% 14%,rgba(255,255,255,.30),transparent 66%),radial-gradient(75% 70% at 80% 92%,rgba(255,255,255,.09),transparent 72%),linear-gradient(140deg,rgba(255,255,255,.15),rgba(255,255,255,.015) 62%,rgba(0,0,0,.075));
  opacity:.82;
}
.theme-knob::after{
  content:"";position:absolute;top:14%;left:20%;width:48%;height:22%;border-radius:50%;
  background:rgba(255,255,255,.13);filter:blur(3px);transform:rotate(-28deg);pointer-events:none;z-index:1;
}
.theme-toggle[data-mode="light"] .theme-knob{
  background:radial-gradient(circle at 30% 22%,#b9e8ff 0%,#70c5fb 38%,#378fe8 72%,#246cc7 100%);
  border-color:rgba(164,215,248,.48);
  box-shadow:0 1px 7px rgba(40,137,232,.19),inset 0 1px 4px rgba(255,255,255,.30),inset 0 -3px 6px rgba(16,69,150,.18);
}
/* Dark-mode orb: richer amber at upper-left fading to translucent honey at lower-right. */
.theme-toggle[data-mode="dark"] .theme-knob{
  transform:translateX(34.5px);
  background:linear-gradient(145deg,rgba(177,78,20,.94) 0%,rgba(219,124,39,.82) 43%,rgba(245,183,103,.66) 76%,rgba(255,222,166,.54) 100%);
  border-color:rgba(244,183,111,.34);
  box-shadow:0 1px 8px rgba(214,117,37,.17),inset 0 1px 4px rgba(255,255,255,.23),inset 0 -3px 7px rgba(120,58,15,.18);
}
.theme-icon{position:absolute;z-index:2;width:13.5px;height:13.5px;transition:opacity .24s ease,transform .48s cubic-bezier(.2,.8,.2,1)}
.moon-icon{fill:#fff;stroke:#fff;stroke-width:.4;opacity:1;transform:rotate(0) scale(1)}

/* v1.3.2 — full-width workspace, animated liquid-glass navigation and settings drawers */
:root{--panel-duration:420ms;--motion-duration:420ms;--page-offset:8px;--page-scale:.987;--panel-closed-scale:.968;--panel-soft-opacity:.88}

body{position:relative;isolation:isolate;overflow:hidden;background:var(--bg)}

.main-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:42px;margin:0 0 18px;padding:1px 0 10px;border-bottom:1px solid color-mix(in srgb,var(--bd) 68%,transparent)}
.brand-trigger{display:inline-flex;align-items:center;gap:0;border:0;background:transparent;color:var(--tx);padding:4px 0;font:650 20px/1 Inter,system-ui,sans-serif;letter-spacing:-.055em;cursor:pointer;transition:opacity .2s ease,transform .2s ease}
.brand-trigger b{color:var(--ac);font-weight:700}.brand-trigger:hover{opacity:.82;transform:translateX(2px)}.brand-trigger:focus-visible{outline:2px solid var(--ac);outline-offset:5px;border-radius:5px}
.toolbar-controls{display:flex;align-items:center;gap:11px;flex:none;margin-right:48px}
/* Navigation drawer opens from left; it overlays rather than squeezing the workspace. */
.nav-drawer{position:fixed!important;z-index:220;left:0;top:0;bottom:0;width:min(310px,88vw);height:100dvh;display:flex;flex-direction:column;gap:0;padding:18px 15px 16px!important;margin:0;background:linear-gradient(145deg,color-mix(in srgb,var(--sf) 88%,rgba(37,190,129,.08)) 0%,color-mix(in srgb,var(--sf) 94%,transparent) 52%,color-mix(in srgb,var(--sf) 90%,rgba(149,117,232,.06)) 100%)!important;border:1px solid color-mix(in srgb,var(--bd) 70%,rgba(255,255,255,.18))!important;border-left:0;border-radius:0 24px 24px 0;box-shadow:18px 0 60px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.24);backdrop-filter:blur(30px) saturate(165%);-webkit-backdrop-filter:blur(30px) saturate(165%);overflow-y:auto;visibility:hidden;opacity:0;transform:translate3d(-102%,0,0);transform-origin:left center;transition:transform var(--panel-duration) cubic-bezier(.22,1,.36,1),opacity var(--panel-duration) ease,visibility 0s linear var(--panel-duration)}

.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 18px;border-bottom:1px solid color-mix(in srgb,var(--bd) 72%,transparent)}
.drawer-head .logo{padding:0;font-size:20px;letter-spacing:-.04em}.drawer-kicker{padding:17px 10px 8px;color:var(--tx2);font-size:10px;font-weight:700;letter-spacing:.14em}
#nav{display:flex;flex-direction:column;gap:5px}#nav button{width:100%;text-align:left;padding:11px 12px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--tx2);font:500 13px Inter,system-ui,sans-serif;cursor:pointer;transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}

.screen-back:focus-visible{outline:2px solid color-mix(in srgb,#17d98a 70%,#8a42ef);outline-offset:3px}

const MASTER_DETAIL_FALLBACK={corr:"corrosionResistance",chem:"chemicalReactivity",mach:"machinability",weld:"weldability",cast:"castability"};
const tx=(m,l)=>l.map(([k,n])=>{
  const profileKey=MASTER_DETAIL_FALLBACK[k];
  const profileValue=profileKey&&m.dataOrigin==="uploadedWorkbook"&&m.masterCatalogue?m.masterCatalogue[profileKey]:null;
  const hasExistingValue=m[k]!==null&&m[k]!==undefined&&m[k]!=="";
  const hasProfileValue=profileValue!==null&&profileValue!==undefined&&profileValue!=="";
  // Keep previously sourced condition-specific data; use the grade-level expanded profile only as a fallback.
  const useProfile=!hasExistingValue&&hasProfileValue;
  const value=hasExistingValue?m[k]:(useProfile?profileValue:null);
  const shown=value!==null&&value!==undefined&&value!==""?esc(value):'<span class="na">Not available</span>';
  const source=useProfile?'<span class="pill">Expanded profile</span>':'';
  return `<tr><td>${n}</td><td colspan="2">${shown}${source?" "+source:""}</td></tr>`;
}).join("");
const extraRows=(m,g)=>(m.extraProps||[]).filter(x=>x.group===g).map(x=>`<tr><td>${esc(x.label)}</td><td colspan="2">${esc(x.value)}</td></tr>`).join("");

 <div class="settings-backdrop" id="settingsBackdrop" data-a="settings-close" aria-hidden="true"></div>
 <section class="settings-panel" id="settingsPanel" role="dialog" aria-label="MaterialLab settings" aria-hidden="${!S.settingsOpen}" aria-modal="true">
 <div class="settings-head"><div><strong>Settings</strong><p class="settings-caption">Tune the look and feel of your workspace.</p></div><button type="button" class="drawer-close settings-close" data-a="settings-close" aria-label="Close settings">×</button></div>
 <section class="settings-section"><div class="settings-section-title">Background <span class="settings-section-note">Original is default</span></div><div class="settings-bg-grid">${bg.map(([id,label])=>`<button type="button" class="settings-bg-option" data-a="setting-bg" data-setting-bg="${id}" aria-label="${label} background" aria-pressed="${id==="upload"?u.customBgActive:(!u.customBgActive&&u.background===id)}"><img class="settings-bg-thumb" src="data:image/webp;base64,${BG_OPTION_ICONS[id]}" alt="" aria-hidden="true" draggable="false"><span class="settings-bg-label">${label}</span><span class="settings-bg-mark" aria-hidden="true">✓</span></button>`).join("")}</div>
 <div class="custom-bg-box"><div class="settings-row-label"><b>Custom background photo</b><small>Choose Upload Photo above to select an image. It is stored on this device.</small></div><div class="custom-bg-actions"><input id="customBgUpload" type="file" accept="image/*" hidden><button type="button" class="settings-remove-btn" id="customBgRemove" data-a="custom-bg-remove" ${u.customBgActive?"":"disabled"}>Remove photo</button></div><div class="custom-bg-status" id="customBgStatus">${u.customBgActive?"Custom photo is active":"No custom photo active"}</div></div></section>

// Custom background photo storage (IndexedDB, with localStorage fallback for restricted file:// contexts).
const ML_BG_DB="MaterialLabLocalAssets",ML_BG_STORE="assets",ML_BG_KEY="customBackground";
function mlOpenBgDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(ML_BG_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(ML_BG_STORE))req.result.createObjectStore(ML_BG_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Could not open local image storage"))})}
async function mlBgDbSet(value){const db=await mlOpenBgDb();return new Promise((resolve,reject)=>{const tx=db.transaction(ML_BG_STORE,"readwrite");tx.objectStore(ML_BG_STORE).put(value,ML_BG_KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function mlBgDbGet(){const db=await mlOpenBgDb();return new Promise((resolve,reject)=>{const tx=db.transaction(ML_BG_STORE,"readonly"),req=tx.objectStore(ML_BG_STORE).get(ML_BG_KEY);req.onsuccess=()=>{const v=req.result;db.close();resolve(v||null)};req.onerror=()=>{db.close();reject(req.error)}})}
async function mlBgDbDelete(){const db=await mlOpenBgDb();return new Promise((resolve,reject)=>{const tx=db.transaction(ML_BG_STORE,"readwrite");tx.objectStore(ML_BG_STORE).delete(ML_BG_KEY);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}

function mlCompressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("Could not read image"));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("This image format could not be opened"));img.onload=()=>{const max=2200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",.84))};img.src=reader.result};reader.readAsDataURL(file)})}
